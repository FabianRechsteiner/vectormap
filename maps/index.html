<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b111c" />
  <title>Hauptkarte - Vectormap</title>
  <meta
    name="description"
    content="Vectormap Hauptkarte mit Basemap-Auswahl, Suche, Navigation, Standort, Vollbild und Style-Vergleich."
  />
</head>
<body>
  <div
    id="compare-root"
    aria-label="Vectormap Hauptkarte"
    data-style-left="../styles/ch.vectormap.lightbasemap.json"
    data-style-right="https://vectortiles.geo.admin.ch/styles/ch.swisstopo.lightbasemap.vt/style.json"
    data-left-basemap-id="vectormap.light"
    data-right-basemap-id="swisstopo.light"
    data-compare-css="../assets/css/maplibre-gl-compare.css"
    data-compare-js="../assets/js/maplibre-gl-compare.js"
    data-center="8.7241,47.4987"
    data-zoom="17"
    data-bearing="0"
    data-pitch="0"
    data-hash="true"
    data-pitch-with-rotate="true"
    data-initial-mode="normal"
    data-label-normal="Switch to single map"
    data-label-split="Switch to split comparison"
    data-label-compare="Switch to side-by-side comparison"
  ></div>

  <script>
    window.vectormapMapPwa = {
      name: "Vectormap Hauptkarte",
      shortName: "Vectormap"
    };

    window.vectormapExampleConfig = {
      autoInit: false,
      maplibreCss: "https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.css",
      maplibreJs: "https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.js",
      pmtilesJs: "https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"
    };

    window.vectormapCompareConfig = { containerId: "compare-root" };
    window.vectormapBasemapControlConfig = {
      initialBasemapId: "vectormap.light",
      initialNormalBasemapId: "vectormap.light",
      initialRightBasemapId: "swisstopo.light",
      position: "bottom-left"
    };
    window.vectormapSearchConfig = {
      mapContainer: ["normalMap", "after", "cmpMapRight"]
    };
  </script>
  <script src="../assets/js/map-page-pwa.js"></script>
  <script src="../assets/js/modules/base-map.js"></script>
  <script src="../assets/js/modules/url-state.js"></script>
  <script src="../assets/js/modules/fullscreen-control.js"></script>
  <script src="../assets/js/modules/navigation-control.js"></script>
  <script src="../assets/js/modules/geolocate-control.js"></script>
  <script src="../assets/js/modules/basemap-control.js"></script>
  <script src="../assets/js/modules/share-control.js"></script>
  <script src="../assets/js/modules/search-map.js"></script>
  <script src="../assets/js/modules/compare-map.js"></script>
</body>
</html>
