<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b111c" />
  <title>Basemap-Auswahl - Vectormap</title>
  <meta name="description" content="Basismodul mit MapLibre GL JS, PMTiles und Basemap-Auswahl.">
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Kartenansicht"></div>

  <script>
    window.vectormapMapPwa = {
      name: "Vectormap Basemap-Auswahl",
      shortName: "Basemaps"
    };

    window.vectormapBasemapControlConfig = {
      initialBasemapId: "vectormap.light",
      position: "bottom-left"
    };
  </script>
  <script src="../assets/js/map-page-pwa.js"></script>
  <script src="../assets/js/modules/base-map.js"></script>
  <script src="../assets/js/modules/basemap-control.js"></script>
  <script src="../assets/js/modules/fullscreen-control.js"></script>
  <script src="../assets/js/modules/navigation-control.js"></script>
  <script src="../assets/js/modules/geolocate-control.js"></script>
</body>
</html>
