<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Vectormap</title>
  <meta name="description" content="Du bist gerade offline. Bitte pruefe deine Verbindung und versuche es erneut." />
  <link rel="icon" type="image/png" href="assets/images/logo_v.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .offline-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .offline-card {
      max-width: 40rem;
      text-align: center;
      background: #111a2a;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <main class="offline-wrap">
    <section class="offline-card">
      <p class="eyebrow">Offline</p>
      <h1>Keine Verbindung verfuegbar</h1>
      <p>Diese Seite ist momentan nicht erreichbar. Sobald du wieder online bist, kannst du normal weiternavigieren.</p>
      <p><a class="btn btn-primary" href="./">Zur Startseite</a></p>
    </section>
  </main>
</body>
</html>
